<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-opacity="0.7" />
  <!-- Mechanical Keyboard Frame -->
  <rect x="86" y="148" width="340" height="216" rx="28" fill="#090d16" stroke="#38bdf8" stroke-width="10" />
  <!-- Keycaps Row 1 -->
  <rect x="114" y="178" width="44" height="38" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="3" />
  <rect x="170" y="178" width="44" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <rect x="226" y="178" width="44" height="38" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="3" />
  <rect x="282" y="178" width="44" height="38" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="3" />
  <!-- Mini TFT Screen on Right -->
  <rect x="340" y="178" width="58" height="88" rx="8" fill="#06b6d4" fill-opacity="0.22" stroke="#22d3ee" stroke-width="4" />
  <circle cx="369" cy="212" r="11" fill="#22d3ee" />
  <rect x="352" y="236" width="34" height="8" rx="4" fill="#a855f7" />
  <!-- Keycaps Row 2 -->
  <rect x="114" y="228" width="58" height="38" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="3" />
  <rect x="184" y="228" width="44" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <rect x="240" y="228" width="86" height="38" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="3" />
  <!-- Spacebar Row -->
  <rect x="114" y="282" width="48" height="42" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="3" />
  <rect x="174" y="282" width="152" height="42" rx="10" fill="url(#accentGrad)" />
  <rect x="338" y="282" width="60" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="3" />
</svg>
